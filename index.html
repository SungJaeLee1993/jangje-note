    <div class="gsc"><span>BEST <b id="gBest">0</b></span><b id="gScore">0</b></div>
    <canvas id="gCv"></canvas>
    <div class="gmsg" id="gMsg">TAP TO START</div>
    <div class="gover" id="gOver" hidden><div class="gt">GAME OVER</div><div class="grow"><div><span>SCORE</span><b id="gS2">0</b></div><div><span>BEST</span><b id="gB2">0</b></div></div><div class="gnew" id="gNew" hidden>NEW BEST!</div><button class="gbtn" data-gretry>RETRY</button></div>
    ${updating?`<button class="gbtn gdone" id="gDone" data-gdone hidden>새 버전 시작하기</button>`:""}`;
  document.body.appendChild(el); document.body.style.overflow="hidden";
  const cv=el.querySelector("#gCv"), ctx=cv.getContext("2d");
  G={el,cv,ctx,state:"ready",best:ls.get("fn_gameBest",0),score:0,raf:0,updating,prog:0,updDone:false,t0:performance.now()};
  $("#gBest").textContent=G.best;
  const fit=()=>{ const r=cv.getBoundingClientRect(), d=Math.min(3,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; G.W=r.width; G.H=r.height; G.d=d; G.ground=Math.round(r.height*.72); };
  fit(); G.fit=fit; addEventListener("resize",fit);
  gReset(); G.last=performance.now(); G.raf=requestAnimationFrame(gLoop);
  el.addEventListener("pointerdown",e=>{
    if(e.target.closest("[data-gretry]")){ gReset(); gStart(); return; }
    if(e.target.closest("[data-gdone]")){ location.replace(location.pathname+"?v="+encodeURIComponent(newVer||Date.now())); return; }
    if(e.target.closest("[data-gx]")){ closeGame(); return; }
    if(e.target.closest(".gup")) return;
    if(G.state==="ready"){ gStart(); gJump(); } else if(G.state==="run") gJump();
  });
  if(updating) runUpdate();
}
function closeGame(){ if(!G) return; cancelAnimationFrame(G.raf); removeEventListener("resize",G.fit); G.el.remove(); G=null; document.body.style.overflow=""; }
function gReset(){ Object.assign(G,{state:"ready",y:0,vy:0,dist:0,speed:330,obs:[],next:520,score:0,newBest:false}); $("#gScore").textContent="0"; $("#gOver").hidden=true; $("#gMsg").hidden=false; }
function gStart(){ G.state="run"; $("#gMsg").hidden=true; $("#gOver").hidden=true; }
function gJump(){ if(G.y===0){ G.vy=-860; buzz(8); } }
function gOverFn(){
  G.state="over"; buzz(40);
  if(G.score>G.best){ G.best=G.score; G.newBest=true; ls.set("fn_gameBest",G.best); }
  $("#gS2").textContent=G.score.toLocaleString(); $("#gB2").textContent=G.best.toLocaleString(); $("#gBest").textContent=G.best.toLocaleString();
  $("#gNew").hidden=!G.newBest; $("#gOver").hidden=false;
}
function gSpawn(){
  const k=Math.random(), fast=G.speed>560;
  const t = k<.55?{type:"hurdle",w:26,h:38+Math.random()*22} : k<.85?{type:"hay",w:40,h:30} : {type:"hurdle",w:26,h:58+(fast?6:0)};
  t.x=G.W+20; G.obs.push(t);
  if(fast && Math.random()<.25) G.obs.push({type:"hurdle",w:26,h:36,x:t.x+t.w+46});
  G.next=G.speed*.62+150+Math.random()*260;
}
function gLoop(now){
  if(!G) return; const dt=Math.max(0,Math.min(.033,(now-G.last)/1000)); G.last=now;
  if(G.state==="run"){
    G.speed=Math.min(920,G.speed+16*dt); const dx=G.speed*dt; G.dist+=dx;
    G.vy+=2700*dt; G.y=Math.min(0,G.y+G.vy*dt); if(G.y===0) G.vy=0;
    for(const o of G.obs) o.x-=dx; G.obs=G.obs.filter(o=>o.x>-80);
    G.next-=dx; if(G.next<=0) gSpawn();
    const sc=Math.floor(G.dist/12); if(sc!==G.score){ G.score=sc; $("#gScore").textContent=sc.toLocaleString(); }
    // 충돌
    const hx=G.hx, hb={l:hx+G.hw*.38,r:hx+G.hw*.86,b:G.ground+G.y-4,t:G.ground+G.y-G.hh*.55};
    for(const o of G.obs){ if(hb.r>o.x+4 && hb.l<o.x+o.w-4 && hb.b>G.ground-o.h+4){ gOverFn(); break; } }
  } else if(G.state==="ready"){ G.dist+=60*dt; }
  if(G.updating) gProg(dt);
  gDraw(); G.raf=requestAnimationFrame(gLoop);
}
function gDraw(){
  const {ctx,d,W,H,ground}=G; ctx.setTransform(d,0,0,d,0,0); ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="#2B2B2B"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,ground+.5); ctx.lineTo(W,ground+.5); ctx.stroke();
  ctx.strokeStyle="#C9CCD3"; ctx.lineCap="round"; const off=G.dist%60;
  for(let i=0;i<W/60+2;i++){ const x=i*60-off, yy=ground+14+(i%3)*9; ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+10+(i%2)*10,yy); ctx.stroke(); }
  for(const o of G.obs) gObs(o);
  // 말
  const H0=Math.min(84,Math.max(60,H*.16)); G.hh=H0; G.hw=H0*229/150; G.hx=Math.max(16,W*.08);
  let f,fr; if(G.y<0||G.vy<0){ fr = G.vy<-380 ? HSPR.jump[1] : G.vy<260 ? HSPR.jump[0] : HSPR.run[5]; }
  else { f=Math.floor(G.dist/(G.state==="run"?26:14))%8; fr=HSPR.run[f]; }
  const s=H0/150, w=fr[2]*s, h=fr[3]*s, cx=G.hx+G.hw/2;
  if(horseImg.complete) ctx.drawImage(horseImg,fr[0],fr[1],fr[2],fr[3],cx-w/2,ground+G.y-h+2,w,h);
}
function gObs(o){
  const {ctx,ground}=G; ctx.strokeStyle=ctx.fillStyle="#2B2B2B"; ctx.lineCap="round";
  if(o.type==="hurdle"){ ctx.lineWidth=4.5; ctx.beginPath();
    ctx.moveTo(o.x,ground); ctx.lineTo(o.x,ground-o.h); ctx.moveTo(o.x+o.w,ground); ctx.lineTo(o.x+o.w,ground-o.h);
    ctx.moveTo(o.x-3,ground-o.h+4); ctx.lineTo(o.x+o.w+3,ground-o.h+4); ctx.moveTo(o.x-3,ground-o.h*.55); ctx.lineTo(o.x+o.w+3,ground-o.h*.55); ctx.stroke(); }
  else { const r=6; ctx.beginPath(); ctx.roundRect(o.x,ground-o.h,o.w,o.h,r); ctx.fill();
    ctx.strokeStyle="#F5F6F8"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o.x+5,ground-o.h*.66); ctx.lineTo(o.x+o.w-5,ground-o.h*.66); ctx.moveTo(o.x+5,ground-o.h*.33); ctx.lineTo(o.x+o.w-5,ground-o.h*.33); ctx.stroke(); }
}
// 업데이트 진행 — 실제 작업이 끝나도 최소 6초는 채우며 보여줌
async function runUpdate(){
  ls.set("fn_updTried",{v:newVer,t:Date.now()});
  try{ await swReg?.update?.(); const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)));
    await fetch(location.pathname+"?v="+encodeURIComponent(newVer||Date.now()),{cache:"reload"}); }catch(e){}
  if(G) G.updDone=true;
}
function gProg(dt){
  const el=performance.now()-G.t0; const target=G.updDone&&el>6000?100:Math.min(92,el/6000*92);
  G.prog+= (target-G.prog)*Math.min(1,dt*3); const p=Math.round(G.prog>=99.5?100:G.prog);
  if(p!==G.pShown){ G.pShown=p; $("#gupP").textContent=p+"%"; $("#gupB").style.width=p+"%";
    if(p===100){ $("#gupT").textContent="업데이트 완료!"; $("#gupS").textContent="기다리는 동안 한 판 더 해도 돼요"; $("#gDone").hidden=false; } }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden && G && G.state==="run") gOverFn(); });

let swReg=null;
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;}).catch(()=>{});
async function checkUpdate(manual){
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); const {version}=await r.json();
    swReg?.update?.();
    if(version && version!==APP_VERSION){
      const tried=ls.get("fn_updTried",null);
      if(tried && tried.v===version && Date.now()-tried.t<15*60000 && !manual) return false;   // just tried: CDN still serving old page
      showUpdateBar(version); return true; }
    if(manual) toast("최신 버전이에요 ("+APP_VERSION+")");
  }catch(e){ if(manual) toast("인터넷 연결을 확인해 주세요"); }
  return false;
}
let newVer=null;
function showUpdateBar(v){
  newVer=v; if($("#updBar")) return;
  const d=document.createElement("div"); d.id="updBar"; d.className="updbar";
  d.innerHTML=`<span class="utx"><b>새 버전이 있어요</b><span>기록은 그대로 유지돼요</span></span><button class="ubtn" data-act="doUpdate">업데이트</button>`;
  document.body.appendChild(d); requestAnimationFrame(()=>d.classList.add("on"));
  let y0=null, dy=0, timer=setTimeout(()=>hideUpdBar(),5000);
  d.addEventListener("touchstart",e=>{ if(e.target.closest(".ubtn")) return; clearTimeout(timer); y0=e.touches[0].clientY; dy=0; d.style.transition="none"; },{passive:true});
  d.addEventListener("touchmove",e=>{ if(y0==null) return; dy=Math.min(0,e.touches[0].clientY-y0); d.style.transform=`translateY(${dy}px)`; if(e.cancelable) e.preventDefault(); },{passive:false});
  d.addEventListener("touchend",()=>{ if(y0==null) return; y0=null; d.style.transition=""; d.style.transform=""; if(dy<-24) hideUpdBar(); else timer=setTimeout(()=>hideUpdBar(),5000); });
}
function hideUpdBar(){ const b=$("#updBar"); if(!b) return; b.classList.remove("on"); setTimeout(()=>b.remove(),350); ls.set("fn_updTried",{v:newVer,t:Date.now()}); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkUpdate(false); });
setTimeout(()=>checkUpdate(false),1500);
setTimeout(()=>monthlyBackup(),4000);
init();
</script>
